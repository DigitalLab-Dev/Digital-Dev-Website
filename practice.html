<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>
<body class="bg-gray">
    <div class="container">
        <h1>Syed Ali Turab</h1>
    </div>
    <div id="mydiv">content will show here</div>
    <button id="btnadd" class="btn btn-warning">Add Content</button>
    <div id="results"></div>
    <table id="mytable" class="table table-striped">
        <thead><tr>
            <th scope="col">User ID</th>
            <th scope="col">ID</th>
            <th scope="col">Title</th>
            <th scope="col">Status</th>
            <th scope="col">Actions</th>
        </tr></thead>
        <tbody id="table-body">
        </tbody>
    </table>

    <form action="edit_button" class="container mt-4" id="edit-form" >
    
        <div class="mb-3">
            <label for="edit-user-id" class="form-label">User ID</label>
            <input type="text" class="form-control" id="edit-user-id" placeholder="Enter User ID" disabled>
        </div>
        <div class="mb-3">
            <label for="edit-id" class="form-label">ID</label>
            <input type="text" class="form-control" id="edit-id" placeholder="Enter ID" disabled>
        </div>
        <div class="mb-3">
            <label for="edit-title" class="form-label">Title</label>
            <input type="text" class="form-control" id="edit-title" placeholder="Enter Title">
        </div>
        <div class="mb-3">
            <label for="edit-status" class="form-label">Status</label>
            <select class="form-control" id="edit-status">
                <option value="True">True</option>
                <option value="False">False</option>
            </select>
        </div>
        <div class="text-center">
            <button type="button" class="btn btn-primary" id="update-btn">Update</button>
            <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
        </div>
    </form>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="myscript.js"></script>
</body>
</html>
